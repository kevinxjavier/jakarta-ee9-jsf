<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<!-- For JakartaEE 8 version and previous
    html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core" -->
<!-- For JakartaEE 9 version -->
<html lang="#{languageController.locale}">
    <f:view xmlns="http://www.w3.org/1999/xhtml"
          xmlns:h="http://xmlns.jcp.org/jsf/html"
          xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
          xmlns:f="http://xmlns.jcp.org/jsf/core"
          locale="#{languageController.locale}">
        <h:head>
            <meta charset="UTF-8" />
            <title>#{title}</title><!-- com.kevinpina.controllers.ProductController.title() -->
            <!--link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous" /-->
            <h:outputStylesheet name="css/bootstrap.min.css" />
            <ui:insert name="head" />
        </h:head>
        <h:body>
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Navbar</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <h:link outcome="index" value="Back" class="nav-link active" /><!-- Use a method get -->
                            </li>
                            <li class="nav-item">
                                <h:link outcome="form" value="#{messageMyLanguage['menu.text.create']}" class="nav-link" />
                            </li>
                            <li class="nav-item">
                                <h:form>
                                    <h:selectOneMenu value="#{languageController.language}" valueChangeListener="#{languageController.selectLanguage}"
                                        onchange="submit()" class="form-select">
                                        <f:selectItem itemLabel="#{messageMyLanguage['menu.text.language']}" itemValue="es" />
                                        <f:selectItems value="#{languageController.supportedLanguages}" />
                                    </h:selectOneMenu>
                                </h:form>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
            <div class="container">

                <!-- Need this com.kevinpina.ProducerResources.beanFacesContext()
                     and validated in com.kevinpina.controllers.ProductController.save() and .delete() -->
                <h:messages globalOnly="true" styleClass="alert" errorClass="alert alert-danger" infoClass="alert alert-info" warnClass="alert alert-warning" />

                <ui:insert name="content" />

                <hr/>

                <footer style="clear: both;">
                    <h:graphicImage value="/resources/img/ventas.png" width="45px" alt="logo enterprise"/>
                    <p><h:outputText value="#{messageMyLanguage['footer.text.author']}" /></p>
                    <p>#{messageMyLanguage['footer.text.author']}</p>
                    <h:outputScript name="js/bootstrap.bundle.min.js" />
                    <ui:insert name="js" />
                </footer>

            </div>
        </h:body>
    </f:view>
</html>
