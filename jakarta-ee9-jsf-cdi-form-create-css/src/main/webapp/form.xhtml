<?xml version="1.0" encoding="UTF-8" ?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="/WEB-INF/layouts/main.xhtml">

    <ui:define name="content">

        <f:metadata>
            <f:viewParam name="id" value="#{productController.id}" />
            <!-- Getting <f:param name="id" value="#{p.id}" /> From index.xhtml and Setting to ProductController.id  -->
        </f:metadata>

        <h:messages style="color: red;" /><!--Show the error messages from form fields-->
        <!--Delete required="true" from the fields like in
            <h:inputText id="price" value="#{product.price}" label="Price" />
            so in Product.class @NotNull validate the price.
        -->

        <h:panelGrid border="1" class="table">

            <f:facet name="header">
                #{h1}
                <br/>
                <h:outputText value="Form Product | #{h1}" />
            </f:facet>

            <h:link outcome="index" value="#{messageMyLanguage['product.button.back']}" class="btn btn-sm btn-primary" />

            <!--#{product.name} calls method product() just 1 time -->
            <h:form>
                <h:panelGrid columns="3" class="table table-hover table-striped">
                    <h:outputLabel value="Name" for="name" class="col-form-label" />
                    <h:inputText id="name" value="#{product.name}" required="true" label="Name" class="form-control" />
                    <h:message for="name" style="color: red;" />

                    <h:outputLabel value="#{messageMyLanguage['product.price']}" for="price" class="col-form-label" />
                    <h:inputText id="price" value="#{product.price}" label="Price" class="form-control" />
                    <h:message for="price" style="color: red;" />

                    <h:outputLabel value="Sku" for="sku" class="col-form-label" />
                    <h:inputText id="sku" value="#{product.sku}" required="true" label="SKU" class="form-control" />
                    <h:message for="sku" style="color: red;" />

                    <h:outputLabel value="#{messageMyLanguage['product.date']}" for="registryDate" class="col-form-label" />
                    <h:inputText id="registryDate" value="#{product.registryDate}" label="Registry Date" required="true" converterMessage="Valid format date yyyy-MM-dd" class="form-control">
                        <f:convertDateTime type="localDate" pattern="yyyy-MM-dd" />
                        <f:passThroughAttribute name="placeholder" value="yyyy-MM-dd" />
                        <!--f:passThroughAttribute name="type" value="date" /--><!--Show Calendar-->
                    </h:inputText>
                    <h:message for="registryDate" style="color: red;" />

                    <h:outputLabel value="Category" for="category" class="col-form-label" />
                    <h:selectOneMenu id="category" value="#{product.category}" class="form-select">
                        <f:selectItem itemLabel="--- Select Category ---" itemValue="#{null}" />
                        <!--f:selectItems value="#{categories}" var="c" itemLabel="#{c.name}" itemValue="#{c.id}" /--><!-- categories is from com.kevinpina.controllers.ProductController.getCategories() -->
                        <f:selectItems value="#{categories}" var="c" itemLabel="#{c.name}" />
                        <f:converter binding="#{categoryConverter}" />
                    </h:selectOneMenu>
                    <h:message for="category" style="color: red;" />

                    <h:commandButton value="#{product.id > 0 ? messageMyLanguage['product.button.edit'] : 'Create'} Product" action="#{productController.save}" class="btn btn-primary" />
                    <h:inputHidden value="#{product.id}" />
                    <!--h:inputHidden value="#{product.registryDate}" / -->
                </h:panelGrid>
            </h:form>
        </h:panelGrid>

    </ui:define>
</ui:composition>
